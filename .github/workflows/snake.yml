
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Blue Snake
        uses: Platane/snk@v3
        with:
          github_user_name: unthinkingFool
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=58A6FF&color_dots=161B22,1F6FEB,388BFD,58A6FF,79C0FF

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
