
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: unthinkingFool
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=58A6FF&color_dots=0D1117,161B22,1F6FEB,388BFD,79C0FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=79C0FF&color_dots=0D1117,161B22,1F6FEB,388BFD,79C0FF

      - name: Push generated files to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
