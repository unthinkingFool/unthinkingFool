
name: Generate Blue Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: unthinkingFool
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%2358A6FF&color_dots=%23161B22,%231F6FEB,%23388BFD,%2358A6FF,%2379C0FF

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
